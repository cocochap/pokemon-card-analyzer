version: '3.9'

# Production Docker Compose — Hostinger VPS
# Tout tourne sur le même VPS : Nginx, Web, API, AI, Postgres, Redis

services:
  # ─── Reverse Proxy ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pokemarket-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - static_files:/var/www/static:ro
    depends_on:
      - web
      - api
    networks:
      - pokemarket

  # ─── Let's Encrypt (HTTPS) ────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: pokemarket-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    networks:
      - pokemarket

  # ─── Database ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pokemarket-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokemarket}
      POSTGRES_USER: ${POSTGRES_USER:-pokemarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pokemarket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokemarket}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NE PAS exposer le port 5432 sur l'interface publique en prod
    expose:
      - "5432"

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pokemarket-redis
    restart: always
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
      --save ""
    volumes:
      - redis_data:/data
    networks:
      - pokemarket
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── API NestJS ───────────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GITHUB_REPO}-api:${IMAGE_TAG:-latest}
    container_name: pokemarket-api
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pokemarket}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pokemarket}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      FRONTEND_URL: https://${DOMAIN}
      AI_SERVICE_URL: http://ai-service:8000
      PORT: 3001
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      POKEMON_TCG_API_KEY: ${POKEMON_TCG_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pokemarket
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── AI Service FastAPI ───────────────────────────────────────────────────
  ai-service:
    image: ghcr.io/${GITHUB_REPO}-ai:${IMAGE_TAG:-latest}
    container_name: pokemarket-ai
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pokemarket}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pokemarket}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_URL: http://api:3001
    volumes:
      - ai_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pokemarket
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/health').raise_for_status()\""]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ─── Web Next.js ──────────────────────────────────────────────────────────
  web:
    image: ghcr.io/${GITHUB_REPO}-web:${IMAGE_TAG:-latest}
    container_name: pokemarket-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
      NEXT_PUBLIC_WS_URL: wss://${DOMAIN}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    depends_on:
      - api
    networks:
      - pokemarket
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  ai_models:
  certbot_www:
  certbot_certs:
  static_files:

networks:
  pokemarket:
    name: pokemarket-prod
    driver: bridge
